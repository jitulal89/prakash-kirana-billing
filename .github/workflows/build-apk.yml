name: Build Prakash Kirana APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract v1.8 Android project
      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project

          unzip -q "PrakashKiranaBilling_V_9.zip" -d project

          echo "Project extracted:"
          find project -maxdepth 6 -type f | sort

      # 3. Locate Android project
      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find project \
            -type f \
            -path "*/app/build.gradle" \
            -print -quit | \
            xargs -r dirname | \
            xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find project -maxdepth 8 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project located at:"
          echo "$PROJECT_DIR"

      # 4. Fix Android build configuration
      - name: Fix Android project
        run: |

          echo "Updating build.gradle..."

          cat > "$PROJECT_DIR/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.prakashkirana.billing'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.prakashkirana.billing'
                  minSdk 23
                  targetSdk 35
                  versionCode 8
                  versionName '1.8'
              }
          }
          EOF

          echo "Updating AndroidManifest.xml..."

          cat > "$PROJECT_DIR/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Prakash Kirana Stores"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <provider
                      android:name=".ShareFileProvider"
                      android:authorities="com.prakashkirana.billing.files"
                      android:exported="false"
                      android:grantUriPermissions="true" />

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          echo "Removing old AppCompat resources..."

          rm -f "$PROJECT_DIR/app/src/main/res/values/styles.xml"
          rm -f "$PROJECT_DIR/app/src/main/res/values/themes.xml"
          rm -f "$PROJECT_DIR/app/src/main/res/values/colors.xml"

          rm -f "$PROJECT_DIR/app/src/main/res/values-night/styles.xml"
          rm -f "$PROJECT_DIR/app/src/main/res/values-night/themes.xml"
          rm -f "$PROJECT_DIR/app/src/main/res/values-night/colors.xml"

          mkdir -p "$PROJECT_DIR/app/src/main/res/values"

          echo "Creating clean Android theme..."

          cat > "$PROJECT_DIR/app/src/main/res/values/styles.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#24466F</item>
                  <item name="android:statusBarColor">#24466F</item>
                  <item name="android:navigationBarColor">#24466F</item>

              </style>

          </resources>
          EOF

          echo "Checking for AppCompat references..."

          if grep -R "Theme.AppCompat" \
            "$PROJECT_DIR/app/src/main" \
            2>/dev/null; then

              echo "ERROR: AppCompat reference found."
              exit 1

          fi

          echo "Android configuration fixed."

      # 5. Verify required files
      - name: Verify project
        run: |

          echo "Checking required files..."

          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/prakashkirana/billing/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/java/com/prakashkirana/billing/ShareFileProvider.java"
          test -f "$PROJECT_DIR/app/src/main/assets/www/index.html"
          test -f "$PROJECT_DIR/app/src/main/assets/www/app.js"

          echo "All required files are present."

      # 6. Setup Java
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 7. Find Android SDK
      - name: Find Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          find "$ANDROID_HOME" \
            -name sdkmanager \
            -type f \
            2>/dev/null || true

      # 8. Install Android SDK
      - name: Prepare Android SDK
        run: |

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager \
              -type f | head -1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 9. Setup Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      # 10. Build APK
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          echo "======================================"
          echo "Building Prakash Kirana Stores APK"
          echo "Version 1.8"
          echo "======================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      # 11. Verify APK
      - name: Check APK
        run: |

          echo "======================================"
          echo "APK generated:"
          echo "======================================"

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prakash-Kirana-Stores-APK-v1.8
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
