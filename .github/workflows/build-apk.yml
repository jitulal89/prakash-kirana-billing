name: Build Prakash Kirana Stores APK v3.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify exact v3.0 ZIP
        run: |
          ZIP_FILE="PrakashKiranaBilling.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found"
            echo "Available ZIP files:"
            ls -lah *.zip || true
            exit 1
          fi

          echo "Using $ZIP_FILE"

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project

          unzip -q "PrakashKiranaBilling.zip" -d project

      - name: Locate Android project
        id: project
        run: |
          PROJECT_DIR=$(find project \
            -type f \
            -name "build.gradle" \
            -path "*/app/*" \
            -print -quit | \
            xargs dirname | \
            xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            find project -type f | head -200
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Verify v3.0 Gradle configuration
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          grep -q "versionName '3.0'" app/build.gradle
          grep -q "com.google.mlkit:text-recognition:16.0.1" app/build.gradle

          echo "v3.0 and ML Kit dependency verified."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prakash-Kirana-Stores-APK-v3.0
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
