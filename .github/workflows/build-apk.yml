name: Build Prakash Kirana APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Download repository
      # ============================================================
      - name: Download project
        uses: actions/checkout@v4


      # ============================================================
      # 2. Extract ONLY the new VoiceFix ZIP
      # ============================================================
      - name: Extract Android project
        run: |
          mkdir project

          echo "Available ZIP files:"
          ls -lh *.zip

          echo "----------------------------------------"
          echo "Extracting VoiceFix project..."
          echo "----------------------------------------"

          unzip -q "PrakashKiranaBilling_Android_Project_VoiceFix.zip" -d project

          echo "----------------------------------------"
          echo "Project extracted:"
          echo "----------------------------------------"

          find project -maxdepth 5 -type f | sort


      # ============================================================
      # 3. Set up Java
      # ============================================================
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 4. Fix Android project
      # ============================================================
      - name: Fix Android project
        run: |

          echo "========================================"
          echo "Fixing Android project"
          echo "========================================"


          # --------------------------------------------------------
          # Fix Gradle
          # --------------------------------------------------------
          cat > project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.prakashkirana.billing'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.prakashkirana.billing'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF


          # --------------------------------------------------------
          # Fix MainActivity
          # --------------------------------------------------------
          cat > project/app/src/main/java/com/prakashkirana/billing/MainActivity.java <<'EOF'
          package com.prakashkirana.billing;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  if (android.os.Build.VERSION.SDK_INT >= 23 &&
                          checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                                  != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                              new String[]{Manifest.permission.RECORD_AUDIO},
                              1001
                      );
                  }

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public void onPermissionRequest(
                              final PermissionRequest request) {

                          runOnUiThread(() ->
                                  request.grant(request.getResources())
                          );
                      }
                  });

                  webView.loadUrl(
                          "file:///android_asset/www/index.html"
                  );
              }

              @Override
              public void onBackPressed() {

                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF


          # --------------------------------------------------------
          # Fix Android Manifest
          # --------------------------------------------------------
          cat > project/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.RECORD_AUDIO"/>

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Prakash Kirana Stores"
                  android:icon="@drawable/ic_launcher">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          # --------------------------------------------------------
          # Fix AppCompat theme issue
          # --------------------------------------------------------
          cat > project/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                     parent="@android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#24466F</item>
                  <item name="android:navigationBarColor">#24466F</item>
                  <item name="android:statusBarColor">#24466F</item>

              </style>
          </resources>
          EOF


          # --------------------------------------------------------
          # Verify VoiceFix web files
          # --------------------------------------------------------
          echo ""
          echo "========================================"
          echo "Checking Voice Billing files"
          echo "========================================"

          if [ ! -f "project/app/src/main/assets/www/index.html" ]; then
              echo "ERROR: index.html not found"
              exit 1
          fi

          if [ ! -f "project/app/src/main/assets/www/app.js" ]; then
              echo "ERROR: app.js not found"
              exit 1
          fi

          echo "index.html found"
          echo "app.js found"

          echo ""
          echo "Web files:"
          find project/app/src/main/assets/www \
            -maxdepth 2 -type f | sort

          echo ""
          echo "========================================"
          echo "Android project fixed successfully"
          echo "========================================"


      # ============================================================
      # 5. Find Android SDK
      # ============================================================
      - name: Find Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          find "$ANDROID_HOME" \
            -name sdkmanager \
            -type f \
            2>/dev/null || true


      # ============================================================
      # 6. Prepare Android SDK
      # ============================================================
      - name: Prepare Android SDK
        run: |

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then

            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager \
              -type f | head -1)

          fi

          if [ -z "$SDKMANAGER" ]; then

            echo "ERROR: sdkmanager was not found"
            exit 1

          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" --licenses || true

          echo ""
          echo "Installing Android SDK components..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================================
      # 7. Set up Gradle
      # ============================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'


      # ============================================================
      # 8. Build APK
      # ============================================================
      - name: Build APK
        working-directory: project
        run: |

          echo "========================================"
          echo "Building Prakash Kirana Stores APK"
          echo "========================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 9. Check APK
      # ============================================================
      - name: Check APK
        run: |

          echo "========================================"
          echo "APK generated:"
          echo "========================================"

          find project/app/build/outputs \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

          echo ""

          if [ ! -f "project/app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "ERROR: APK was not generated"
              exit 1
          fi

          echo "APK successfully generated."


      # ============================================================
      # 10. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prakash-Kirana-Stores-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
