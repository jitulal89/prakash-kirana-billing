name: Build Prakash Kirana Stores APK v2.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: zipfile
        run: |
          ZIP_FILE="PrakashKiranaBilling_V3.0.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found"
            echo "Available ZIP files:"
            ls -lah *.zip || true
            exit 1
          fi

          echo "zip=$ZIP_FILE" >> $GITHUB_OUTPUT

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project

          unzip -q "${{ steps.zipfile.outputs.zip }}" -d project

          echo "Extracted files:"
          find project -maxdepth 4 -type f | head -100

      - name: Locate Android project
        id: project
        run: |
          PROJECT_DIR=$(find project -type f -name "build.gradle" -path "*/app/*" -print -quit | xargs dirname | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            find project -type f | head -200
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Fix app Gradle configuration
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.prakashkirana.billing'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.prakashkirana.billing'
                  minSdk 23
                  targetSdk 35
                  versionCode 22
                  versionName "2.2"
              }
          }

          dependencies {
              implementation 'com.google.mlkit:text-recognition:16.0.1'
          }
          EOF

          echo "===== app/build.gradle ====="
          cat app/build.gradle

      - name: Verify ML Kit OCR dependency
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          grep -q "com.google.mlkit:text-recognition:16.0.1" app/build.gradle

          if [ $? -ne 0 ]; then
            echo "ERROR: ML Kit OCR dependency missing"
            exit 1
          fi

          echo "ML Kit OCR dependency verified."

      - name: Fix Android Manifest
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Prakash Kirana Stores"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <provider
                      android:name=".ShareFileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true" />

              </application>

          </manifest>
          EOF

      - name: Fix Android theme
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1565C0</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:statusBarColor">#1565C0</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

      - name: Verify OCR Java source
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if [ ! -f app/src/main/java/com/prakashkirana/billing/MainActivity.java ]; then
            echo "Searching for MainActivity.java..."
            find app/src/main/java -name "MainActivity.java" -print
          fi

          echo "Checking ML Kit imports:"
          grep -R "com.google.mlkit" app/src/main/java || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "Finding sdkmanager..."
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          chmod +x gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prakash-Kirana-Stores-APK-v2.2
          path: |
            project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
