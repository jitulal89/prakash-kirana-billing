name: Build Prakash Kirana APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Download files from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract the v1.6 Android project
      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project

          unzip -q "PrakashKiranaBilling_V6.zip" -d project

          echo "Extracted files:"
          find project -maxdepth 5 -type f | sort

      # 3. Find actual Android project folder
      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find project -type f -path "*/app/build.gradle" -print -quit | xargs -r dirname | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            find project -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      # 4. Check important files
      - name: Check project
        run: |
          echo "Checking Android project..."

          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/prakashkirana/billing/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/assets/www/index.html"
          test -f "$PROJECT_DIR/app/src/main/assets/www/app.js"

          echo "All required files found."

      # 5. Setup Java
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 6. Find Android SDK
      - name: Find Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          find "$ANDROID_HOME" \
            -name sdkmanager \
            -type f 2>/dev/null || true

      # 7. Install Android SDK components
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager \
              -type f | head -1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 8. Setup Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      # 9. Build APK
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Building Prakash Kirana Stores APK..."
          gradle assembleDebug --no-daemon --stacktrace

      # 10. Check APK
      - name: Check APK
        run: |
          echo "APK generated:"

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prakash-Kirana-Stores-APK-v1.6
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
