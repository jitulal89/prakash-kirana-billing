name: Build Prakash Kirana Stores APK v3.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # FIND V3.1 ZIP
      # ---------------------------------------------------------
      - name: Verify v3.1 ZIP
        run: |
          ZIP_FILE="PrakashKiranaBilling.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found"
            echo ""
            echo "ZIP files available in repository:"
            ls -lah *.zip || true
            exit 1
          fi

          echo "Using: $ZIP_FILE"


      # ---------------------------------------------------------
      # EXTRACT PROJECT
      # ---------------------------------------------------------
      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project

          unzip -q \
            "PrakashKiranaBilling.zip" \
            -d project

          echo "Project extracted."


      # ---------------------------------------------------------
      # LOCATE ANDROID PROJECT
      # ---------------------------------------------------------
      - name: Locate Android project
        id: project
        run: |
          PROJECT_DIR=$(find project \
            -type f \
            -name "build.gradle" \
            -path "*/app/*" \
            -print -quit | \
            xargs dirname | \
            xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project could not be found."
            find project -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------------
      # VERIFY V3.1 GRADLE
      # ---------------------------------------------------------
      - name: Verify v3.1 configuration
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "===== app/build.gradle ====="
          cat app/build.gradle

          echo ""
          echo "Checking version..."

          grep -q "versionName '3.1'" app/build.gradle

          if [ $? -ne 0 ]; then
            echo "ERROR: versionName 3.1 not found"
            exit 1
          fi

          echo "Version 3.1 verified."


      # ---------------------------------------------------------
      # VERIFY ML KIT
      # ---------------------------------------------------------
      - name: Verify ML Kit OCR dependency
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          grep -q "com.google.mlkit:text-recognition:16.0.1" \
            app/build.gradle

          if [ $? -ne 0 ]; then
            echo "ERROR: ML Kit OCR dependency missing"
            exit 1
          fi

          echo "ML Kit OCR dependency verified."


      # ---------------------------------------------------------
      # VERIFY LOGO
      # ---------------------------------------------------------
      - name: Verify Prakash Kirana logo
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "Searching for logo files..."

          find app/src/main -type f \
            \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) \
            -print

          LOGO=$(find app/src/main \
            -type f \
            \( -iname "logo.jpg" -o -iname "logo.png" \) \
            | head -1)

          if [ -z "$LOGO" ]; then
            echo "WARNING: Logo file not found."
          else
            echo "Logo found:"
            echo "$LOGO"
          fi


      # ---------------------------------------------------------
      # JAVA
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ---------------------------------------------------------
      # ANDROID SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "Finding sdkmanager..."
            SDKMANAGER=$(find "$ANDROID_HOME" \
              -name sdkmanager \
              -type f | head -1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ---------------------------------------------------------
      # GRADLE
      # ---------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'


      # ---------------------------------------------------------
      # BUILD APK
      # ---------------------------------------------------------
      - name: Build v3.1 Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "Starting Gradle build..."

          gradle clean assembleDebug --stacktrace


      # ---------------------------------------------------------
      # VERIFY APK
      # ---------------------------------------------------------
      - name: Verify generated APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "Searching for APK..."

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK generated successfully:"
          ls -lh "$APK"


      # ---------------------------------------------------------
      # UPLOAD APK
      # ---------------------------------------------------------
      - name: Upload v3.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Prakash-Kirana-Stores-APK-v3.1
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
