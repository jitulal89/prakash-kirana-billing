      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found. Installing Android command line tools..."

            mkdir -p "$ANDROID_HOME/cmdline-tools"

            cd /tmp

            wget -q \
              https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
              -O commandlinetools.zip

            rm -rf "$ANDROID_HOME/cmdline-tools/latest"

            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

            unzip -q commandlinetools.zip \
              -d "$ANDROID_HOME/cmdline-tools/latest"

            mv "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools/"* \
              "$ANDROID_HOME/cmdline-tools/latest/"

            rm -rf "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools"

            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager:"
          "$SDKMANAGER" --version

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
