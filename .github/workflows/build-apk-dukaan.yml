name: Build DukaanBill APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          mkdir -p app-source
          unzip -q DukaanBill_Complete_Source_v2.zip -d app-source

          echo "Extracted files:"
          find app-source -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."
          find app-source -name settings.gradle -o -name settings.gradle.kts

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: |
          chmod +x $(find app-source -name gradlew | head -1)

      - name: Build Debug APK
        working-directory: app-source
        run: |
          ./gradlew assembleDebug

      - name: Find APK
        run: |
          find app-source -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DukaanBill-debug-apk
          path: app-source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
