name: Build DukaanBill

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -o DukaanBill_Complete_Source_v2.zip -d source

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find source -name 'settings.gradle*' | head -1)")
          cd "$PROJECT"

          echo "Project: $PWD"
          echo "Gradle:"
          gradle --version

          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DukaanBill-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
