name: Build Prakash Kirana Stores APK v3.5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify exact source ZIP
        run: |
          ZIP_FILE="PrakashKiranaBilling_3Oct.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found"
            echo "ZIP files available:"
            ls -lah *.zip || true
            exit 1
          fi

          echo "Using source: $ZIP_FILE"

      - name: Extract source project
        run: |
          rm -rf project
          mkdir project

          unzip -q \
            "PrakashKiranaBilling_3Oct.zip" \
            -d project

          echo "Source extracted."

      - name: Locate Android project
        id: project
        run: |
          PROJECT_DIR=$(find project \
            -type f \
            -name "build.gradle" \
            -path "*/app/*" \
            -print -quit | \
            xargs dirname | \
            xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            find project -maxdepth 6 -type f | head -300
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify source files
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "Checking required source files..."

          test -f app/src/main/java/com/prakashkirana/billing/MainActivity.java
          test -f app/src/main/assets/www/index.html
          test -f app/src/main/assets/www/app.js
          test -f app/src/main/assets/www/styles.css

          echo "Required source files found."

      - name: Verify new billing address
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          ADDRESS="Diamond One building, near Dhantoli park, opposite Axis Bank, Dhantoli, Nagpur - 440012"

          echo "Searching for billing address..."

          if grep -R -F "$ADDRESS" app/src/main >/dev/null 2>&1; then
            echo "New billing address verified."
          else
            echo "ERROR: New billing address was not found in source."
            echo ""
            echo "Address-related lines currently found:"
            grep -R -i "Dhantoli\|Diamond One\|440012" app/src/main || true
            exit 1
          fi

      - name: Verify ML Kit OCR
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if grep -q "com.google.mlkit:text-recognition:16.0.1" app/build.gradle; then
            echo "ML Kit OCR dependency verified."
          else
            echo "ERROR: ML Kit OCR dependency missing."
            cat app/build.gradle
            exit 1
          fi

      - name: Verify app icon/logo
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "Checking logo/icon files..."

          find app/src/main/res \
            -type f \
            \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.webp" \) \
            -print || true

          find app/src/main/assets/www \
            -type f \
            -iname "logo*" \
            -print || true

          echo "Logo/icon verification completed."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" \
              -name sdkmanager \
              -type f | head -1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "Building Prakash Kirana Stores APK..."

          gradle clean assembleDebug --stacktrace

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "Generated APK files:"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prakash-Kirana-Stores-APK-v3.5
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
