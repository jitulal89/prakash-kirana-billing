name: Build Prakash Kirana Stores APK v3.6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify exact v3.6 source ZIP
        run: |
          ZIP_FILE="PrakashKiranaBilling.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found"
            ls -lah *.zip || true
            exit 1
          fi

      - name: Extract source project
        run: |
          rm -rf project
          mkdir project
          unzip -q "PrakashKiranaBilling.zip" -d project

      - name: Locate Android project
        id: project
        run: |
          PROJECT_DIR=$(find project -type f -name "build.gradle" -path "*/app/*" -print -quit | xargs dirname | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            find project -maxdepth 6 -type f | head -300
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using: $PROJECT_DIR"

      - name: Verify version and address
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          grep -q "versionName '3.6'" app/build.gradle
          grep -q "Diamond One building, near Dhantoli park, opposite Axis Bank, Dhantoli, Nagpur - 440012" app/src/main/java/com/prakashkirana/billing/MainActivity.java
          grep -q "Diamond One building, near Dhantoli park, opposite Axis Bank, Dhantoli, Nagpur - 440012" app/src/main/assets/www/app.js
          grep -q "Diamond One building, near Dhantoli park, opposite Axis Bank, Dhantoli, Nagpur - 440012" app/src/main/assets/www/index.html
          echo "Version 3.6 and billing address verified."

      - name: Verify OCR and PDF compression code
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          grep -q "com.google.mlkit:text-recognition:16.0.1" app/build.gradle
          grep -q "Bitmap.createScaledBitmap" app/src/main/java/com/prakashkirana/billing/MainActivity.java
          echo "OCR and compact PDF logo code verified."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prakash-Kirana-Stores-APK-v3.6
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
