name: Build Prakash Kirana Stores APK v3.7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v3.7 source ZIP
        run: |
          ZIP_FILE="PrakashKiranaBilling.zip"
          test -f "$ZIP_FILE" || { echo "ERROR: $ZIP_FILE not found"; ls -lah *.zip || true; exit 1; }

      - name: Extract source
        run: |
          rm -rf project
          mkdir project
          unzip -q "PrakashKiranaBilling.zip" -d project

      - name: Locate Android project
        id: project
        run: |
          PROJECT_DIR=$(find project -type f -name build.gradle -path '*/app/*' -print -quit | xargs dirname | xargs dirname)
          test -n "$PROJECT_DIR" || { echo "ERROR: Android project not found"; exit 1; }
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using $PROJECT_DIR"

      - name: Verify required changes
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          grep -q "Diamond One building, near Dhantoli park," app/src/main/java/com/prakashkirana/billing/MainActivity.java
          grep -q "opposite Axis Bank, Dhantoli, Nagpur - 440012" app/src/main/java/com/prakashkirana/billing/MainActivity.java
          grep -q "int max = 320" app/src/main/java/com/prakashkirana/billing/MainActivity.java
          ! grep -q 'id="whatsappBtn"' app/src/main/assets/www/index.html
          ! grep -q 'function openWhatsAppModal' app/src/main/assets/www/app.js
          grep -q 'com.google.mlkit:text-recognition:16.0.1' app/build.gradle
          echo "All v3.7 checks passed."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1); fi
          test -n "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle clean assembleDebug --stacktrace

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -n "$APK" || { echo "APK not generated"; exit 1; }
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prakash-Kirana-Stores-APK-v3.7
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
